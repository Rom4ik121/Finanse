name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Flet
        run: |
          pip install "flet>=0.83.0,<0.87"

      - name: Build iOS
        run: |
          flet build ipa --yes

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FinWise-iOS
          path: build/ipa/
          
